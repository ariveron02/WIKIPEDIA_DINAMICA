
services:
  web:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: wikipedia-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: wikipedia_dinamica
      MYSQL_USER: adminWikipedia
      MYSQL_PASSWORD: admin123
    ports:
      - "3306:3306"
    networks:
      - app-network
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: wikipedia-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: adminWikipedia
      PMA_PASSWORD: admin123
    depends_on:
      - db
    networks:
      - app-network

networks:
  app-network:

volumes:
  db_data:
